@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap');
:root{
  --bg-page:#14161c; --bg-panel:#1b1e26; --bg-card:#20232c;
  --border:#2c303a; --orange:#e35f2e; --orange-dim:#b8481f;
  --text-primary:#f2f1ee; --text-secondary:#9aa0ab; --text-muted:#6b7280;

*{box-sizing:border-box;}
body{margin:0; background:var(--bg-page); color:var(--text-primary); font-family:'Inter',sans-serif;}

.subnav{display:flex; align-items:center; gap:30px; padding:16px 32px; background:var(--bg-panel); border-bottom:1px solid var(--border);}
.subnav a{color:var(--text-secondary); text-decoration:none; font-size:14px; font-weight:500; padding-bottom:4px; border-bottom:2px solid transparent;}
.subnav a.active{color:var(--orange); border-color:var(--orange);}
.nav-dropdown{position:relative;}
.nav-dropdown > a{display:block;}
.nav-dropdown-menu{
  display:none; position:absolute; top:100%; left:0; padding-top:10px; z-index:20;
}
.nav-dropdown:hover .nav-dropdown-menu{display:block;}
.nav-dropdown-menu-inner{
  background:var(--bg-card); border:1px solid var(--border); border-radius:8px;
  min-width:130px; padding:6px; box-shadow:0 8px 24px rgba(0,0,0,.4);
}
.nav-dropdown-menu a{
  display:block; padding:8px 10px; border-radius:6px; font-size:13px;
  color:var(--text-secondary); text-decoration:none; border-bottom:none;
}
.nav-dropdown-menu a:hover, .nav-dropdown-menu a.active{background:var(--bg-panel); color:var(--orange);}
.subnav a.nav-cta{
  color:#1c1108; background:var(--orange); padding:7px 18px; border-radius:7px;
  font-weight:700; border-bottom:none; box-shadow:0 1px 0 rgba(0,0,0,.2);
}
.subnav a.nav-cta:hover{background:#f06c37;}
.subnav a.nav-cta.active{background:#f06c37; box-shadow:0 0 0 2px rgba(227,95,46,.4);}

main{max-width:1200px; margin:0 auto; padding:32px;}

.company{margin-bottom:40px;}
.company-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; padding-bottom:10px; border-bottom:1px solid var(--border);}
.company-head h2{font-family:'Poppins'; font-weight:600; font-size:19px; margin:0; color:var(--orange);}
.head-actions{display:flex; gap:8px;}
.collapse-btn{background:transparent; border:1px solid var(--border); color:var(--text-secondary); font-size:12px; font-weight:500; padding:6px 12px; border-radius:6px; cursor:pointer; font-family:'Inter';}
.collapse-btn:hover{border-color:var(--orange-dim); color:var(--orange);}
.new-btn{background:var(--bg-card); border:1px solid var(--orange-dim); color:var(--orange); font-size:12.5px; font-weight:600; padding:6px 14px; border-radius:6px; cursor:pointer; font-family:'Inter';}

.member-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:18px;}
.member-card{position:relative; background:var(--bg-panel); border:1px solid var(--border); border-radius:12px; padding:14px; cursor:pointer; transition:border-color .15s;}
.member-card:hover{border-color:var(--orange-dim);}

.remove-btn{

}

.zoom-btn{

}
.download-btn:hover{background:var(--orange); color:#1c1108; border-color:var(--orange);}
.download-btn.busy{pointer-events:none; opacity:.6;}

.unit-download-btn{

<script>
// --- Password gate + toast notifications (shared across every page) ---
const SITE_PASSWORD = 'boost';
let AUTH_OK = false;

function withAuth(url){
  if(!AUTH_OK) return url;
  try{
    const u = new URL(url, window.location.href);
    u.searchParams.set('k', SITE_PASSWORD);
    return u.pathname + u.search;
  }catch(e){ return url; }
}

function carryAuthForward(){
  document.querySelectorAll('a[href]').forEach(a=>{
    const href = a.getAttribute('href');
    if(!href || !href.includes('.html')) return;
    a.setAttribute('href', withAuth(href));
  });
}

(function initAuthGate(){
  const params = new URLSearchParams(window.location.search);
  const gate = document.getElementById('authGate');
  // Automation tools (Playwright, Selenium, Puppeteer, etc.) set this flag on
  // navigator by spec -- real visitors never have it set. Used here to let
  // the Discord bot's scraper through without needing its own config changed,
  // since the password gate is a casual visitor-facing thing, not real auth.
  const isAutomated = navigator.webdriver === true;
  if(params.get('k') === SITE_PASSWORD || isAutomated){
    AUTH_OK = true;
    if(gate) gate.remove();
    carryAuthForward();
    return;
  }
  const submit = document.getElementById('authSubmit');
  const input = document.getElementById('authPassword');
  const error = document.getElementById('authError');
  function tryUnlock(){
    if(input.value === SITE_PASSWORD){
      AUTH_OK = true;
      gate.remove();
      carryAuthForward();
    } else {
      error.style.display = 'block';
      input.value = '';
      input.focus();
    }
  }
  submit.addEventListener('click', tryUnlock);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
  input.focus();
})();

function showToast(message, type){
  const container = document.getElementById('toastContainer');
  if(!container) return;
  const toast = document.createElement('div');
  toast.className = 'toast' + (type === 'error' ? ' error' : type === 'success' ? ' success' : '');
  toast.textContent = message;
  container.appendChild(toast);
  requestAnimationFrame(()=> toast.classList.add('show'));
  setTimeout(()=>{
    toast.classList.remove('show');
    setTimeout(()=> toast.remove(), 250);
  }, 4000);
}

// Set this to your deployed Worker URL (no trailing slash), e.g. 'https://unkso-api.yoursubdomain.workers.dev'
const API_BASE = 'https://unkso-api.adambramfitt.workers.dev';

async function loadJSON(key, defaults){
  try{
    const res = await fetch(`${API_BASE}/api/${key}`);
    if(res.ok){
      const data = await res.json();
      if(data !== null) return data;
    }
  }catch(err){ console.log('Could not load '+key+' from API, using defaults', err); }
  try{
    await fetch(`${API_BASE}/api/${key}`, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(defaults)
    });
  }catch(err){ console.log('Could not seed '+key, err); }
  return defaults;
}

async function saveJSON(key, value){
  try{
    const res = await fetch(`${API_BASE}/api/${key}`, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(value)
    });
    return res.ok;
  }catch(err){ console.log('Save failed for '+key, err); return false; }
}

function ribbonBackground(r){
  return r.image ? `url(${r.image})` : `repeating-linear-gradient(45deg,#33362a 0 6px,#25271e 6px 12px)`;
}


// Splits items into rows (top-to-bottom order) of at most maxPerRow, distributing
// as evenly as possible across the minimum number of rows, and always giving any
// remainder to the bottom-most row(s) first, so the rack is never top-heavy.
function distributeBottomHeavy(items, maxPerRow){
  const n = items.length;
  if(n === 0) return [];
  const numRows = Math.ceil(n / maxPerRow);
  const base = Math.floor(n / numRows);
  let rem = n - base*numRows;
  const sizes = new Array(numRows).fill(base);
  for(let i = numRows-1; i >= 0 && rem > 0; i--, rem--){
    sizes[i] += 1;
  }
  const rows = [];
  let idx = 0;
  for(const size of sizes){
    rows.push(items.slice(idx, idx+size));
    idx += size;
  }
  return rows;
}

function ribbonHTML(ribbonKeys, ribbonMap){
  if(ribbonKeys.length === 0) return '';
  const rows = distributeBottomHeavy(ribbonKeys, 4);
  const cellW=4.6, cellH=1.84, colGap=0.35, rowGap=0.35;
  const centerX=69.2, rackBottom=54;
  const R = rows.length;

  let html = '';
  rows.forEach((row,ri)=>{
    const rowsFromBottom = R-1-ri;
    const top = rackBottom - (rowsFromBottom+1)*(cellH+rowGap);
    const totalW = row.length*cellW + (row.length-1)*colGap;
    const left0 = centerX - totalW/2;
    row.forEach((key,ci)=>{
      const left = left0 + ci*(cellW+colGap);
      const def = ribbonMap[key];
      if(!def) return;
      html += `<div class="ribbon" style="left:${left}%; top:${top}%; width:${cellW}%; height:${cellH}%; background-image:${ribbonBackground(def)};"></div>`;
    });
  });
  return html;
}

const MAX_BADGES = 6;
const MAX_BADGES_PER_POCKET = 3;

function claspStackHTML(def, coreLeft, coreTop, coreW, coreH, jacketHtoW){
  if(!def.clasps || def.clasps.length === 0) return '';
  const claspH = coreH * 0.5;
  const linkH = coreH * 0.16;
  const gapV = coreH * 0.07;
  const coreCenterX = coreLeft + coreW/2;
  const linkAspect = (def.linkWidth && def.linkHeight) ? def.linkWidth/def.linkHeight : 0.65;
  const linkW = linkH * linkAspect * jacketHtoW;
  let html = '';
  let cursorTop = coreTop + coreH;

  def.clasps.slice(0,5).forEach((clasp)=>{
    cursorTop += gapV;
    if(def.linkImage){
      html += `<div class="badge-link" style="left:${coreCenterX-linkW/2}%; top:${cursorTop}%; width:${linkW}%; height:${linkH}%; background-image:url(${def.linkImage});"></div>`;
    } else {
      const dotSize = linkH*0.75;
      html += `<div class="badge-link-dot" style="left:${coreCenterX-dotSize*0.95}%; top:${cursorTop}%; width:${dotSize}%; height:${dotSize}%;"></div>`;
      html += `<div class="badge-link-dot" style="left:${coreCenterX+dotSize*0.15}%; top:${cursorTop}%; width:${dotSize}%; height:${dotSize}%;"></div>`;
    }
    cursorTop += linkH + gapV;

    const claspAspect = (clasp.width && clasp.height) ? clasp.width/clasp.height : 3.5;
    const claspW = claspH * claspAspect * jacketHtoW;
    const bg = clasp.image ? `url(${clasp.image})` : `repeating-linear-gradient(45deg,#33362a 0 3px,#25271e 3px 6px)`;
    html += `<div class="badge-clasp" style="left:${coreCenterX-claspW/2}%; top:${cursorTop}%; width:${claspW}%; height:${claspH}%; background-image:${bg};"></div>`;
    cursorTop += claspH;
  });
  return html;
}

function badgeHTML(badgeKeys, badgeMap){
  const gap = 0.35;
  // Converts a badge's own real-pixel aspect ratio into a jacket-mini WIDTH
  // percentage for a given HEIGHT percentage — % width and % height don't map
  // to equal real distances since the jacket art itself isn't square.
  const jacketHtoW = 2052/3023;
  const keys = (badgeKeys||[]).slice(0, MAX_BADGES);
  const rightKeys = keys.slice(0, MAX_BADGES_PER_POCKET);          // right pocket, above the button
  const leftKeys = keys.slice(MAX_BADGES_PER_POCKET, MAX_BADGES);  // left pocket, raised to sit level with the ribbon rack

  function renderRow(rowKeys, centerX, cellH, rowBottom){
    if(rowKeys.length === 0) return '';
    const widths = rowKeys.map(key=>{
      const def = badgeMap[key];
      const aspect = (def && def.width && def.height) ? def.width/def.height : 1;
      return cellH * aspect * jacketHtoW;
    });
    const totalW = widths.reduce((a,b)=>a+b,0) + gap*(rowKeys.length-1);
    let left = centerX - totalW/2;
    const top = rowBottom - cellH;
    let html = '';
    rowKeys.forEach((key,ci)=>{
      const def = badgeMap[key];
      const w = widths[ci];
      if(def){
        const bg = def.image ? `url(${def.image})` : `repeating-linear-gradient(45deg,#33362a 0 4px,#25271e 4px 8px)`;
        html += `<div class="badge" style="left:${left}%; top:${top}%; width:${w}%; height:${cellH}%; background-image:${bg};"></div>`;
        html += claspStackHTML(def, left, top, w, cellH, jacketHtoW);
      }
      left += w + gap;
    });
    return html;
  }

  return renderRow(rightKeys, 68.8, 5.5, 63) + renderRow(leftKeys, 31.2, 5.5, 54);
}

function shoulderInsigniaHTML(def){
  const w=4.2, h=2.5;
  // Anchor is now the CENTER of the insignia, sitting in the middle of the strap's
  // width (between its two boundary seams) rather than pinned to either edge —
  // matched directly against a reference showing it centered in that band.
  const leftAnchorX=20, leftAnchorY=22;
  const rightAnchorX=80, rightAnchorY=22.5;
  const left = `
    <div class="insignia" style="left:${leftAnchorX-w/2}%; top:${leftAnchorY-h/2}%; width:${w}%; height:${h}%; background-image:url(${def.insignia}); transform:rotate(62deg) scale(1.3);"></div>`;
  const right = `
    <div class="insignia" style="left:${rightAnchorX-w/2}%; top:${rightAnchorY-h/2}%; width:${w}%; height:${h}%; background-image:url(${def.insignia}); transform:rotate(-62deg) scale(1.3);"></div>`;
  return left + right;
}

// Ranks below CDT wear insignia on the sleeve instead of the shoulder — large,
// duplicated on both arms, showing only the half of the image that would
// actually be visible on a curved sleeve (the other half wraps out of view).
// Position measured directly off a reference photo of the sleeve.
function sleeveInsigniaHTML(def){
  const cellH = 26 * 0.6; // scale per feedback
  const jacketHtoW = 2052/3023;
  const aspect = (def.insigniaWidth && def.insigniaHeight) ? def.insigniaWidth/def.insigniaHeight : 1;
  const boxW = cellH * (aspect/2) * jacketHtoW; // half-image slice, so half the full-image width
  const centerY = 54;
  const top = centerY - cellH/2;
  // Sleeve's outer edge measured directly off the jacket art at this height (fabric
  // color transition, not guessed) — the insignia sits flush against it, with its
  // CUT edge (the truncated half) facing outward against that seam, and the
  // image's own natural edge facing inward toward the body.
  const sleeveEdgeX = 9.9;
  const leftBoxLeft = sleeveEdgeX;
  const rightBoxLeft = (100 - sleeveEdgeX) - boxW;
  const left = `<div class="sleeve-insignia" style="left:${leftBoxLeft}%; top:${top}%; width:${boxW}%; height:${cellH}%; background-image:url(${def.insignia}); background-size:200% 100%; background-position:right center; transform:rotate(12deg);"></div>`;
  const right = `<div class="sleeve-insignia" style="left:${rightBoxLeft}%; top:${top}%; width:${boxW}%; height:${cellH}%; background-image:url(${def.insignia}); background-size:200% 100%; background-position:left center; transform:rotate(-12deg);"></div>`;
  return left + right;
}

function insigniaHTML(rankName, rankMap){
  const def = rankMap[rankName];
  if(!def || !def.insignia) return '';
  const cdtIdx = RANKS.findIndex(r=>r.name==='CDT');
  const rankIdx = RANKS.findIndex(r=>r.name===rankName);
  const useSleeve = cdtIdx !== -1 && rankIdx > cdtIdx;
  return useSleeve ? sleeveInsigniaHTML(def) : shoulderInsigniaHTML(def);
}

function fitNameTape(tapeEl){
  const span = tapeEl.querySelector('span');
  if(!span) return;
  const maxWidth = tapeEl.clientWidth * 0.92;
  let size = tapeEl.clientHeight * 0.6;
  span.style.fontSize = size + 'px';
  let guard = 0;
  while(span.scrollWidth > maxWidth && size > 3 && guard < 120){
    size -= 0.4;
    span.style.fontSize = size + 'px';
    guard++;
  }
}

function neckMedalHTML(memberRibbonKeys, ribbonMap){
  // If the member holds any ribbon with neck art set (e.g. the Medal of Honor),
  // show it hanging at the neck — in addition to its normal spot in the rack.
  // Bounds measured directly off a reference image of the jacket with the
  // medal in place. Uses contain (not cover) so the art's own proportions
  // aren't cropped, since neck decorations aren't a uniform shape like ribbons.
  const key = (memberRibbonKeys||[]).find(k => ribbonMap[k] && ribbonMap[k].neckImage);
  if(!key) return '';
  const def = ribbonMap[key];
  return `<div class="neck-medal" style="background-image:url(${def.neckImage});"></div>`;
}

function collarImageHTML(def, centerX, centerY, rotateDeg){
  if(!def || !def.image) return '';
  const cellH = 5.5;
  const jacketHtoW = 2052/3023;
  const aspect = (def.width && def.height) ? def.width/def.height : 1;
  const w = cellH * aspect * jacketHtoW;
  return `<div class="pin" style="left:${centerX-w/2}%; top:${centerY-cellH/2}%; width:${w}%; height:${cellH}%; background-image:url(${def.image}); transform:rotate(${rotateDeg}deg);"></div>`;
}

// Left collar tip shows the member's Unit Pin; right shows Officer/Enlisted —
// two independent images now, not the same one mirrored on both sides.
function pinHTML(pinKey, pinMap, officerType, officerEnlistedMap){
  const leftCenterX = 36.0, rightCenterX = 64.0, centerY = 21.9;
  const left = pinKey ? collarImageHTML(pinMap[pinKey], leftCenterX, centerY, -3) : '';
  const right = officerType ? collarImageHTML(officerEnlistedMap[officerType], rightCenterX, centerY, 3) : '';
  return left + right;
}

// Large square badge on the right pocket BAG (below the button/flap, distinct
// from the smaller badge row that sits on the flap above it) — bounds
// measured directly off the jacket art so it's centered in the pocket
// outline. Sized as a true square in real pixels, not just equal percentages,
// since the jacket art itself isn't square.
function ncoaHTML(ncoaType, ncoaMap){
  if(!ncoaType) return '';
  const def = ncoaMap[ncoaType];
  if(!def || !def.image) return '';
  const centerX = 68.5, centerY = 88, heightPct = 24 * 0.7;
  const jacketHtoW = 2052/3023;
  const widthPct = heightPct * jacketHtoW;
  return `<div class="badge" style="left:${centerX-widthPct/2}%; top:${centerY-heightPct/2}%; width:${widthPct}%; height:${heightPct}%; background-image:url(${def.image});"></div>`;
}

function jacketHTML(member, ribbonMap, badgeMap, rankMap, pinMap, officerEnlistedMap, ncoaMap){
  return `
    ${insigniaHTML(member.rank, rankMap)}
    ${pinHTML(member.pin, pinMap, member.officerType, officerEnlistedMap)}
    <div class="name-tape" style="left:23.25%; top:57%; width:16%; height:6.2%;"><span>${member.name.toUpperCase()}</span></div>
    ${ribbonHTML(member.ribbons, ribbonMap)}
    ${badgeHTML(member.badges||[], badgeMap)}
    ${ncoaHTML(member.ncoaType, ncoaMap)}
    <div class="jacket-overlay"></div>
    ${neckMedalHTML(member.ribbons, ribbonMap)}
  `;
}

let MEMBERS = [];
let RANKS = [];
let RIBBONS = [];
let BADGES = [];
let PINS = [];
let OFFICER_ENLISTED = [];
let NCOA = [];

function ribbonMapOf(){ const m={}; (Array.isArray(RIBBONS)?RIBBONS:[]).forEach(r=>m[r.key]=r); return m; }
function badgeMapOf(){ const m={}; (Array.isArray(BADGES)?BADGES:[]).forEach(b=>m[b.key]=b); return m; }
function pinMapOf(){ const m={}; (Array.isArray(PINS)?PINS:[]).forEach(p=>m[p.key]=p); return m; }
function officerEnlistedMapOf(){ const m={}; (Array.isArray(OFFICER_ENLISTED)?OFFICER_ENLISTED:[]).forEach(o=>m[o.key]=o); return m; }
function ncoaMapOf(){ const m={}; (Array.isArray(NCOA)?NCOA:[]).forEach(n=>m[n.key]=n); return m; }
function rankMapOf(){ const m={}; RANKS.forEach(r=>m[r.name]=r); return m; }
function rankIndex(name){ return RANKS.findIndex(r=>r.name===name); }

function newId(){ return 'm_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

async function addMember(unit){
  const member = { id:newId(), name:"New Member", rank: (RANKS[0] && RANKS[0].name) || "PVT", unit: unit, position:"Member", ribbons:[], badges:[], pin:null, officerType:null, ncoaType:null };
  MEMBERS.push(member);
  await saveJSON('members', MEMBERS);
  renderRoster();
}

async function removeMember(id){
  if(!confirm('Remove this jacket from the roster?')) return;
  MEMBERS = MEMBERS.filter(m=>m.id!==id);
  await saveJSON('members', MEMBERS);
  renderRoster();
}

let searchTerm = '';

function matchesSearch(m){
  const q = searchTerm.trim().toLowerCase();
  if(!q) return true;
  return m.name.toLowerCase().includes(q)
    || m.rank.toLowerCase().includes(q)
    || m.position.toLowerCase().includes(q)
    || m.unit.toLowerCase().includes(q);
}

function sortBySeniority(list){
  return [...list].sort((a,b)=>{
    const ap = POSITION_SENIORITY.indexOf(a.position); const bp = POSITION_SENIORITY.indexOf(b.position);
    const aPos = ap === -1 ? POSITION_SENIORITY.length : ap;
    const bPos = bp === -1 ? POSITION_SENIORITY.length : bp;
    if(aPos !== bPos) return aPos - bPos;
    const ar = rankIndex(a.rank); const br = rankIndex(b.rank);
    const aRank = ar === -1 ? RANKS.length : ar;
    const bRank = br === -1 ? RANKS.length : br;
    if(aRank !== bRank) return aRank - bRank;
    return a.name.localeCompare(b.name);
  });
}

let collapsedUnits = new Set();

function renderRoster(){
  const main = document.getElementById('main');
  main.innerHTML = '';
  const ribbonMap = ribbonMapOf();
  const badgeMap = badgeMapOf();
  const rankMap = rankMapOf();
  const pinMap = pinMapOf();
  const officerEnlistedMap = officerEnlistedMapOf();
  const ncoaMap = ncoaMapOf();
  UNIT_OPTIONS.forEach(unit=>{
    const allInUnit = MEMBERS.filter(m=>m.unit===unit);
    const members = sortBySeniority(allInUnit.filter(matchesSearch));
    const isCollapsed = collapsedUnits.has(unit);
    const section = document.createElement('section');
    section.className = 'company';
    section.innerHTML = `
      <div class="company-head">
        <h2>${unit}</h2>
        <div class="head-actions">
          <button class="collapse-btn" title="${isCollapsed ? 'Expand' : 'Collapse'}">${isCollapsed ? '▸ Expand' : '▾ Collapse'}</button>
          <button class="unit-download-btn" title="Download all ${unit} jackets as a zip">Download All</button>
          <button class="new-btn" data-unit="${unit}">+ New</button>
        </div>
      </div>
      <div class="member-grid" style="${isCollapsed ? 'display:none;' : ''}"></div>
    `;
    section.querySelector('.new-btn').addEventListener('click', ()=>addMember(unit));
    section.querySelector('.collapse-btn').addEventListener('click', ()=>{
      if(collapsedUnits.has(unit)) collapsedUnits.delete(unit);
      else collapsedUnits.add(unit);
      renderRoster();
    });
    section.querySelector('.unit-download-btn').addEventListener('click', (e)=>{
      downloadMembersZip(members, ribbonMap, badgeMap, rankMap, pinMap, officerEnlistedMap, ncoaMap, safeFilename(unit) + '-jackets.zip', e.currentTarget, false);
    });
    const grid = section.querySelector('.member-grid');
    if(members.length === 0){
      grid.innerHTML = allInUnit.length === 0
        ? `<div class="empty-note">No members yet in ${unit}.</div>`
        : `<div class="empty-note">No matches in ${unit}.</div>`;
    }
    members.forEach(m=>{
      const card = document.createElement('div');
      card.className = 'member-card';
      card.innerHTML = `
        <button class="remove-btn" title="Remove">&times;</button>
        <button class="zoom-btn" title="Zoom">&#128269;</button>
        <button class="download-btn" title="Download PNG">&#11015;</button>
        <div class="jacket-mini">${jacketHTML(m, ribbonMap, badgeMap, rankMap, pinMap, officerEnlistedMap, ncoaMap)}</div>
        <div class="mcaption">
          <div class="mname">${m.rank}.${m.name}</div>
          <div class="mrank">${m.position} - ${m.unit}</div>
        </div>
      `;
      card.querySelector('.remove-btn').addEventListener('click', (e)=>{
        e.stopPropagation();
        removeMember(m.id);
      });
      card.querySelector('.zoom-btn').addEventListener('click', (e)=>{
        e.stopPropagation();
        openZoom(m, ribbonMap, badgeMap, rankMap, pinMap, officerEnlistedMap, ncoaMap);
      });
      card.querySelector('.download-btn').addEventListener('click', (e)=>{
        e.stopPropagation();
        downloadMemberPNG(m, ribbonMap, badgeMap, rankMap, pinMap, officerEnlistedMap, ncoaMap, e.currentTarget);
      });
      card.addEventListener('click', ()=>{
        window.location.href = withAuth('admin.html?member=' + encodeURIComponent(m.id));
      });
      grid.appendChild(card);
    });
    main.appendChild(section);
  });
  document.querySelectorAll('.name-tape').forEach(fitNameTape);
}

// ---- PNG / ZIP export ----
// Rendered at 1600px wide (jacket art's own proportions give ~1600x1087) which
// keeps ribbon text, badges, and the name tape legible while keeping file size
// reasonable (~150-350KB per jacket depending on how many ribbons/badges).
const DOWNLOAD_WIDTH = 1600;

function loadScriptOnce(src){
  return new Promise((resolve, reject)=>{
    if(document.querySelector(`script[src="${src}"]`)){ resolve(); return; }
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('Could not load ' + src));
    document.head.appendChild(s);
  });
}
async function ensureHtml2Canvas(){
  if(!window.html2canvas) await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
}
async function ensureJSZip(){
  if(!window.JSZip) await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
}

function safeFilename(s){
  return s.replace(/[^a-z0-9.\-_]+/gi, '_');
}

async function renderJacketCanvas(member, ribbonMap, badgeMap, rankMap, pinMap, officerEnlistedMap, ncoaMap){
  await ensureHtml2Canvas();
  const holder = document.createElement('div');
  holder.className = 'jacket-mini';
  holder.style.cssText = `position:fixed; left:-99999px; top:0; width:${DOWNLOAD_WIDTH}px; border-radius:0;`;
  holder.innerHTML = jacketHTML(member, ribbonMap, badgeMap, rankMap, pinMap, officerEnlistedMap, ncoaMap);
  document.body.appendChild(holder);
  const tape = holder.querySelector('.name-tape');
  if(tape) fitNameTape(tape);
  const canvas = await html2canvas(holder, { backgroundColor: null, scale: 1, useCORS: true });
  document.body.removeChild(holder);
  return canvas;
}

function canvasToPngBlob(canvas){
  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

function triggerBlobDownload(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

async function downloadMemberPNG(member, ribbonMap, badgeMap, rankMap, pinMap, officerEnlistedMap, ncoaMap, btn){
  const original = btn.innerHTML;
  btn.classList.add('busy');
  try{
    const canvas = await renderJacketCanvas(member, ribbonMap, badgeMap, rankMap, pinMap, officerEnlistedMap, ncoaMap);
    const blob = await canvasToPngBlob(canvas);
    triggerBlobDownload(blob, safeFilename(`${member.rank}.${member.name}`) + '.png');
  }catch(err){
    console.log('Download failed', err);
    showToast('Could not generate that PNG. Try again.', 'error');
  }finally{
    btn.classList.remove('busy');
    btn.innerHTML = original;
  }
}

function buildAwardsJSON(member, ribbonMap, badgeMap, pinMap, officerEnlistedMap, ncoaMap){
  const ribbons = (member.ribbons||[]).map(k => ribbonMap[k]?.label).filter(Boolean);
  const badges = (member.badges||[]).map(k => badgeMap[k]?.label).filter(Boolean);
  const pin = member.pin ? (pinMap[member.pin]?.label || null) : null;
  const officerType = member.officerType ? (officerEnlistedMap[member.officerType]?.label || null) : null;
  const ncoa = member.ncoaType ? (ncoaMap[member.ncoaType]?.label || null) : null;
  return JSON.stringify({
    name: member.name,
    rank: member.rank,
    unit: member.unit,
    position: member.position,
    ribbons,
    badges,
    pin,
    officerType,
    ncoa
  }, null, 2);
}

async function downloadMembersZip(members, ribbonMap, badgeMap, rankMap, pinMap, officerEnlistedMap, ncoaMap, zipFilename, btn, groupByUnit){
  if(members.length === 0){ showToast('Nothing to download.', 'error'); return; }
  const original = btn.textContent;
  btn.setAttribute('disabled','');
  btn.classList.add('busy');
  try{
    await ensureJSZip();
    const zip = new JSZip();
    for(let i=0;i<members.length;i++){
      btn.textContent = `Rendering ${i+1}/${members.length}…`;
      const m = members[i];
      const canvas = await renderJacketCanvas(m, ribbonMap, badgeMap, rankMap, pinMap, officerEnlistedMap, ncoaMap);
      const blob = await canvasToPngBlob(canvas);
      const stem = safeFilename(`${m.rank}.${m.name}`);
      const path = groupByUnit ? `${safeFilename(m.unit)}/${stem}` : stem;
      zip.file(path + '.png', blob);
      zip.file(path + '.json', buildAwardsJSON(m, ribbonMap, badgeMap, pinMap, officerEnlistedMap, ncoaMap));
    }
    btn.textContent = 'Zipping…';
    const zipBlob = await zip.generateAsync({type:'blob'});
    triggerBlobDownload(zipBlob, zipFilename);
  }catch(err){
    console.log('Zip download failed', err);
    showToast('Could not build the zip. Try again.', 'error');
  }finally{
    btn.removeAttribute('disabled');
    btn.classList.remove('busy');
    btn.textContent = original;
  }
}

function openZoom(member, ribbonMap, badgeMap, rankMap, pinMap, officerEnlistedMap, ncoaMap){
  const overlay = document.getElementById('zoomOverlay');
  const stage = document.getElementById('zoomStage');
  stage.innerHTML = jacketHTML(member, ribbonMap, badgeMap, rankMap, pinMap, officerEnlistedMap, ncoaMap);
  document.getElementById('zoomName').textContent = member.rank + '.' + member.name;
  document.getElementById('zoomRank').textContent = member.position + ' - ' + member.unit;
  overlay.classList.add('open');
  const tape = stage.querySelector('.name-tape');
  if(tape) fitNameTape(tape);
}

function closeZoom(){
  document.getElementById('zoomOverlay').classList.remove('open');
}
document.getElementById('zoomClose').addEventListener('click', closeZoom);
document.getElementById('zoomOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'zoomOverlay') closeZoom();
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape') closeZoom();
});

document.getElementById('downloadAllBtn').addEventListener('click', (e)=>{
  e.preventDefault();
  downloadMembersZip(MEMBERS, ribbonMapOf(), badgeMapOf(), rankMapOf(), pinMapOf(), officerEnlistedMapOf(), ncoaMapOf(), 'unkso-all-jackets.zip', e.currentTarget, true);
});

document.getElementById('searchInput').addEventListener('input', (e)=>{
  searchTerm = e.target.value;
  renderRoster();
});

window.addEventListener('resize', () => {
  document.querySelectorAll('.name-tape').forEach(fitNameTape);
});

function normalizeRanks(ranks){
  return ranks.map(r => typeof r === 'string' ? { name:r, insignia:null } : r);
}

async function init(){
  MEMBERS = await loadJSON('members', DEFAULT_MEMBERS);
  const rawRanks = await loadJSON('ranks', DEFAULT_RANKS);
  const ranksNeedMigration = rawRanks.some(r => typeof r === 'string');
  RANKS = normalizeRanks(rawRanks);
  if(ranksNeedMigration) await saveJSON('ranks', RANKS);
  RIBBONS = await loadJSON('ribbons', DEFAULT_RIBBONS);
  BADGES = await loadJSON('badges', DEFAULT_BADGES);
  PINS = await loadJSON('pins', []);
  OFFICER_ENLISTED = await loadJSON('officerenlisted', DEFAULT_OFFICER_ENLISTED);
  NCOA = await loadJSON('ncoa', DEFAULT_NCOA);
  renderRoster();

  // Reached via the "Download All" link on another page — kick off the same
  // all-jackets zip the in-page button triggers, then clean the URL.
  if(new URLSearchParams(window.location.search).get('autodownload') === '1'){
    const btn = document.getElementById('downloadAllBtn');
    downloadMembersZip(MEMBERS, ribbonMapOf(), badgeMapOf(), rankMapOf(), pinMapOf(), officerEnlistedMapOf(), ncoaMapOf(), 'unkso-all-jackets.zip', btn, true);
    const cleanUrl = new URL(window.location.href);
    cleanUrl.searchParams.delete('autodownload');
    history.replaceState(null, '', cleanUrl.pathname + cleanUrl.search);
  }
}
init();
