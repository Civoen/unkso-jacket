<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UNKSO — Badge Tracker</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap');
:root{
  --bg-page:#14161c; --bg-panel:#1b1e26; --bg-card:#20232c;
  --border:#2c303a; --orange:#e35f2e; --orange-dim:#b8481f;
  --text-primary:#f2f1ee; --text-secondary:#9aa0ab; --text-muted:#6b7280;
  --red:#c0392b;
}
*{box-sizing:border-box;}
body{margin:0; background:var(--bg-page); color:var(--text-primary); font-family:'Inter',sans-serif;}

.subnav{display:flex; align-items:center; gap:30px; padding:16px 32px; background:var(--bg-panel); border-bottom:1px solid var(--border);}
.subnav a{color:var(--text-secondary); text-decoration:none; font-size:14px; font-weight:500; padding-bottom:4px; border-bottom:2px solid transparent;}
.subnav a.active{color:var(--orange); border-color:var(--orange);}
.subnav a.nav-secondary{
  color:var(--text-secondary); background:var(--bg-card); border:1px solid var(--border);
  padding:6px 16px; border-radius:7px; font-weight:600; text-decoration:none; font-size:13px; cursor:pointer;
}
.subnav a.nav-group-start{margin-left:auto;}
.subnav a.nav-secondary:hover{border-color:var(--orange-dim); color:var(--orange);}
.subnav a.nav-cta{
  color:#1c1108; background:var(--orange); padding:7px 18px; border-radius:7px;
  font-weight:700; border-bottom:none; box-shadow:0 1px 0 rgba(0,0,0,.2);
}
.subnav a.nav-cta:hover{background:#f06c37;}


main{max-width:1200px; margin:0 auto; padding:32px; display:grid; grid-template-columns:320px 1fr; gap:24px; align-items:start;}
h1{font-family:'Poppins'; font-weight:600; font-size:22px; margin:0 0 4px;}
.sub{color:var(--text-muted); font-size:12.5px; margin-bottom:22px; letter-spacing:.03em;}

.panel{background:var(--bg-panel); border:1px solid var(--border); border-radius:14px; padding:20px;}

.new-member-btn{
  width:100%; background:var(--orange); color:#1c1108; border:none; border-radius:8px;
  padding:10px; font-family:'Poppins'; font-weight:600; font-size:13.5px; cursor:pointer;
  margin-bottom:12px;
}
.new-member-btn:hover{background:#f06c37;}
.search-row{margin-bottom:12px;}
.search-row input{
  width:100%; background:var(--bg-card); border:1px solid var(--border); color:var(--text-primary);
  padding:10px 14px; border-radius:8px; font-size:14px; font-family:'Inter';
}
.filter-row{margin-bottom:14px;}
.filter-row select{
  width:100%; background:var(--bg-card); border:1px solid var(--border); color:var(--text-primary);
  padding:9px 12px; border-radius:8px; font-size:13.5px; font-family:'Inter';
}

.member-list{max-height:640px; overflow-y:auto;}
.member-item{
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding:10px 12px; border-radius:8px; cursor:pointer; font-size:13.5px; margin-bottom:4px;
}
.member-item:hover{background:var(--bg-card);}
.member-item.selected{background:var(--bg-card); border:1px solid var(--orange-dim); color:var(--orange);}
.member-item .unit-tag{font-size:10.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em;}
.member-item.selected .unit-tag{color:var(--orange-dim);}
.no-results{color:var(--text-muted); font-size:12.5px; padding:8px 4px;}

.member-edit-header{margin-bottom:18px; padding-bottom:16px; border-bottom:1px solid var(--border);}
.member-edit-top{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
.member-name-input{
  flex:1; background:var(--bg-card); border:1px solid var(--border); color:var(--text-primary);
  padding:9px 12px; border-radius:8px; font-family:'Poppins'; font-weight:600; font-size:16px;
}
.delete-member-btn{
  background:var(--bg-card); border:1px solid var(--border); color:var(--text-muted);
  padding:9px 14px; border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:'Inter';
  flex-shrink:0;
}
.delete-member-btn:hover{border-color:var(--red); color:var(--red);}
.member-edit-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
.member-edit-grid label{display:block; font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px;}
.member-edit-grid select{
  width:100%; background:var(--bg-card); border:1px solid var(--border); color:var(--text-primary);
  padding:8px 10px; border-radius:6px; font-size:13px; font-family:'Inter';
}
.tracker-count{color:var(--text-muted); font-size:12.5px; margin-bottom:12px;}
.tracker-category-tabs{display:flex; gap:4px; margin-bottom:14px; border-bottom:1px solid var(--border);}
.tracker-cat-btn{
  background:none; border:none; color:var(--text-secondary); padding:8px 4px; margin-right:16px;
  font-size:13.5px; font-weight:600; font-family:'Poppins'; cursor:pointer; border-bottom:2px solid transparent;
}
.tracker-cat-btn:hover{color:var(--orange);}
.tracker-cat-btn.active{color:var(--orange); border-bottom-color:var(--orange);}
.tracker-filters{display:flex; gap:8px; margin-bottom:16px;}
.tracker-filter-btn{
  background:var(--bg-card); border:1px solid var(--border); color:var(--text-secondary);
  padding:7px 14px; border-radius:7px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:'Inter';
}
.tracker-filter-btn:hover{border-color:var(--orange-dim); color:var(--orange);}
.tracker-filter-btn.active{background:var(--orange); border-color:var(--orange); color:#1c1108;}

.badge-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.badge-group-header{
  grid-column:1/-1; color:var(--orange); font-size:11.5px; font-weight:700; text-transform:uppercase;
  letter-spacing:.05em; padding:10px 2px 2px; border-top:1px solid var(--border); margin-top:4px;
}
.badge-group-header:first-child{border-top:none; margin-top:0; padding-top:2px;}
.badge-check{display:flex; align-items:center; gap:8px; background:var(--bg-card); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:12.5px; cursor:pointer;}
.badge-check .rank-tag{
  background:var(--bg-panel); color:var(--text-muted); font-size:10px; font-weight:700;
  border-radius:4px; padding:2px 5px; flex-shrink:0;
}
.badge-check .inactive-tag{
  color:var(--text-muted); font-size:10.5px; margin-left:auto; text-transform:uppercase; letter-spacing:.03em;
}
.check-label{min-width:0; overflow-wrap:break-word;}
.badge-check input{
  appearance:none; -webkit-appearance:none; margin:0; flex-shrink:0; cursor:pointer;
  width:16px; height:16px; border-radius:4px; border:1px solid var(--border);
  background:var(--bg-page); position:relative;
}
.badge-check input:checked{background:var(--orange); border-color:var(--orange);}
.badge-check input:checked::after{
  content:''; position:absolute; left:4px; top:1px; width:5px; height:9px;
  border:solid #1c1108; border-width:0 2px 2px 0; transform:rotate(45deg);
}
.badge-check .swatch{width:16px; height:16px; border-radius:3px; border:1px solid rgba(0,0,0,.35); flex-shrink:0; background-size:contain; background-position:center; background-repeat:no-repeat;}

.empty-state{color:var(--text-muted); font-size:13px; padding:40px 0; text-align:center;}

.site-footer{border-top:1px solid var(--border); padding:18px 20px; text-align:center; color:var(--text-muted); font-size:11.5px; letter-spacing:.02em;}

/* Toast notifications */
.toast-container{position:fixed; bottom:20px; right:20px; z-index:500; display:flex; flex-direction:column; gap:10px; pointer-events:none; max-width:340px;}
.toast{background:var(--bg-panel); border:1px solid var(--border); border-left:4px solid var(--orange); color:var(--text-primary); padding:12px 16px; border-radius:8px; font-size:13px; line-height:1.4; box-shadow:0 4px 14px rgba(0,0,0,.4); pointer-events:auto; opacity:0; transform:translateY(8px); transition:opacity .2s, transform .2s;}
.toast.show{opacity:1; transform:translateY(0);}
.toast.error{border-left-color:var(--red, #c0392b);}
.toast.success{border-left-color:#4caf6b;}

/* Password gate */
.auth-gate{position:fixed; inset:0; background:rgba(10,11,14,.94); z-index:1000; display:flex; align-items:center; justify-content:center; padding:20px;}
.auth-box{background:var(--bg-panel); border:1px solid var(--border); border-radius:14px; padding:32px; max-width:340px; width:100%; text-align:center;}
.auth-box h2{font-family:'Poppins'; font-weight:600; font-size:19px; margin:0 0 8px; color:var(--orange);}
.auth-box p{color:var(--text-secondary); font-size:13px; margin:0 0 18px;}
.auth-box input{width:100%; background:var(--bg-card); border:1px solid var(--border); color:var(--text-primary); padding:11px 14px; border-radius:8px; font-size:14px; text-align:center; margin-bottom:12px; font-family:'Inter'; box-sizing:border-box;}
.auth-box button{width:100%; background:var(--orange); color:#1c1108; border:none; border-radius:8px; padding:11px; font-family:'Poppins'; font-weight:600; font-size:14px; cursor:pointer;}
.auth-box button:hover{background:#f06c37;}
.auth-error{color:var(--red, #c0392b); font-size:12.5px; margin-top:10px; display:none;}
/* Mobile */
@media (max-width:800px){
  main{grid-template-columns:1fr; padding:20px; gap:16px;}
  .member-edit-grid{grid-template-columns:1fr 1fr;}
}
@media (max-width:520px){
  .subnav{padding:12px 16px; gap:18px; overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .subnav a{flex-shrink:0;}
  main{padding:14px;}
  .panel{padding:14px;}
  .badge-grid{grid-template-columns:1fr;}
  .member-edit-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>

<div class="auth-gate" id="authGate">
  <div class="auth-box">
    <h2>Restricted Access</h2>
    <p>Enter the password to continue.</p>
    <input type="password" id="authPassword" placeholder="Password" autocomplete="off">
    <button id="authSubmit">Enter</button>
    <div class="auth-error" id="authError">Incorrect password.</div>
  </div>
</div>
<div class="toast-container" id="toastContainer"></div>

<div class="subnav">
  <a href="index.html">Jackets</a>
  <a href="tracker.html" class="active">Tracker</a>
  <a href="ranks.html" class="nav-group-start">Ranks</a>
  <a href="ribbons.html">Ribbons</a>
  <a href="badges.html">Badges</a>
  <a href="pins.html">Pins</a>
  <a href="index.html?autodownload=1" class="nav-secondary">Download All</a>
  <a href="backups.html">Backups</a>
</div>

<main>
  <div class="panel">
    <button class="new-member-btn" id="newMemberBtn">+ New member</button>
    <div class="search-row"><input id="searchInput" type="text" placeholder="Search members…"></div>
    <div class="filter-row">
      <select id="unitFilterSelect"></select>
    </div>
    <div class="member-list" id="memberList"></div>
  </div>

  <div class="panel">
    <div id="trackerBody"><div class="empty-state">Select a member to view their badge record.</div></div>
  </div>
</main>

<script>
// --- Password gate + toast notifications (shared across every page) ---
const SITE_PASSWORD = 'boost';
let AUTH_OK = false;

function withAuth(url){
  if(!AUTH_OK) return url;
  try{
    const u = new URL(url, window.location.href);
    u.searchParams.set('k', SITE_PASSWORD);
    return u.pathname + u.search;
  }catch(e){ return url; }
}

function carryAuthForward(){
  document.querySelectorAll('a[href]').forEach(a=>{
    const href = a.getAttribute('href');
    if(!href || !href.includes('.html')) return;
    a.setAttribute('href', withAuth(href));
  });
}

(function initAuthGate(){
  const params = new URLSearchParams(window.location.search);
  const gate = document.getElementById('authGate');
  // Automation tools (Playwright, Selenium, Puppeteer, etc.) set this flag on
  // navigator by spec -- real visitors never have it set. Used here to let
  // the Discord bot's scraper through without needing its own config changed,
  // since the password gate is a casual visitor-facing thing, not real auth.
  const isAutomated = navigator.webdriver === true;
  if(params.get('k') === SITE_PASSWORD || isAutomated){
    AUTH_OK = true;
    if(gate) gate.remove();
    carryAuthForward();
    return;
  }
  const submit = document.getElementById('authSubmit');
  const input = document.getElementById('authPassword');
  const error = document.getElementById('authError');
  function tryUnlock(){
    if(input.value === SITE_PASSWORD){
      AUTH_OK = true;
      gate.remove();
      carryAuthForward();
    } else {
      error.style.display = 'block';
      input.value = '';
      input.focus();
    }
  }
  submit.addEventListener('click', tryUnlock);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
  input.focus();
})();

function showToast(message, type){
  const container = document.getElementById('toastContainer');
  if(!container) return;
  const toast = document.createElement('div');
  toast.className = 'toast' + (type === 'error' ? ' error' : type === 'success' ? ' success' : '');
  toast.textContent = message;
  container.appendChild(toast);
  requestAnimationFrame(()=> toast.classList.add('show'));
  setTimeout(()=>{
    toast.classList.remove('show');
    setTimeout(()=> toast.remove(), 250);
  }, 4000);
}

const UNITS = ["Battalion","Bravo","Charlie","Delta"];
const API_BASE = 'https://unkso-api.adambramfitt.workers.dev';

async function loadJSON(key, defaults){
  try{
    const res = await fetch(`${API_BASE}/api/${key}`);
    if(res.ok){
      const data = await res.json();
      if(data !== null) return data;
    }
  }catch(err){ console.log('Could not load '+key+' from API, using defaults', err); }
  return defaults;
}

async function saveJSON(key, value){
  try{
    const res = await fetch(`${API_BASE}/api/${key}`, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(value)
    });
    return res.ok;
  }catch(err){ console.log('Save failed for '+key, err); return false; }
}

async function saveJSONChecked(key, value){
  const ok = await saveJSON(key, value);
  if(!ok) showToast('Could not save that change — check your connection to the API.', 'error');
  return ok;
}

function normalizeRanks(ranks){
  return ranks.map(r => typeof r === 'string' ? { name:r, insignia:null } : r);
}

let MEMBERS = [];
let BADGES = [];
let RIBBONS = [];
let RANKS = [];
let NCOA = [];
const UNIT_OPTIONS = ["Battalion","Bravo","Charlie","Delta"];
const POSITION_OPTIONS = ["Member","SL","PS","1SG","XO","CO"];
const DEFAULT_NCOA = [
  { key:"ncoa1", label:"Tier 1", image:null, width:1, height:1 },
  { key:"ncoa2", label:"Tier 2", image:null, width:1, height:1 },
  { key:"ncoa3", label:"Tier 3", image:null, width:1, height:1 }
];

function newId(){ return 'm_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
let TRACKER = {};
let RIBBON_TRACKER = {};
let searchTerm = '';
let unitFilter = UNITS[0];
let selectedMemberId = null;

function rankIndex(name){ return RANKS.findIndex(r=>r.name===name); }

function sortedMembers(){
  return [...MEMBERS].sort((a,b)=>{
    const ai = rankIndex(a.rank); const bi = rankIndex(b.rank);
    const aRank = ai === -1 ? RANKS.length : ai;
    const bRank = bi === -1 ? RANKS.length : bi;
    if(aRank !== bRank) return aRank - bRank;
    return a.name.localeCompare(b.name);
  });
}

function renderMemberList(){
  const list = document.getElementById('memberList');
  const q = searchTerm.trim().toLowerCase();
  const visible = sortedMembers().filter(m=>{
    if(q) return m.name.toLowerCase().includes(q);
    return m.unit === unitFilter;
  });

  if(visible.length === 0){
    list.innerHTML = `<div class="no-results">${q ? 'No members match your search.' : `No ${unitFilter} members.`}</div>`;
    return;
  }

  list.innerHTML = '';
  visible.forEach(m=>{
    const row = document.createElement('div');
    row.className = 'member-item' + (m.id === selectedMemberId ? ' selected' : '');
    const tag = q ? `${m.rank} · ${m.unit}` : m.rank;
    row.innerHTML = `<span>${m.name}</span><span class="unit-tag">${tag}</span>`;
    row.addEventListener('click', ()=>{
      selectedMemberId = m.id;
      renderMemberList();
      renderTracker();
    });
    list.appendChild(row);
  });
}

let trackerFilterMode = 'all';
let trackerCategory = 'ribbons'; // 'badges' | 'ribbons'

function currentCategoryData(){
  return trackerCategory === 'ribbons'
    ? { items: RIBBONS, tracker: RIBBON_TRACKER, storageKey: 'ribbontracker', hasUnit: false, noun: 'ribbons' }
    : { items: BADGES, tracker: TRACKER, storageKey: 'tracker', hasUnit: true, noun: 'badges' };
}

function renderTracker(){
  const body = document.getElementById('trackerBody');
  const m = MEMBERS.find(x=>x.id===selectedMemberId);
  if(!m){
    body.innerHTML = '<div class="empty-state">Select a member to view their record.</div>';
    return;
  }
  const cat = currentCategoryData();
  const earned = new Set(cat.tracker[m.id] || []);
  body.innerHTML = `
    <div class="member-edit-header">
      <div class="member-edit-top">
        <input type="text" id="editName" class="member-name-input" value="${m.name}">
        <button class="delete-member-btn" id="deleteMemberBtn" title="Delete member">Delete</button>
      </div>
      <div class="member-edit-grid">
        <div><label>Rank</label><select id="editRank"></select></div>
        <div><label>Unit</label><select id="editUnit"></select></div>
        <div><label>Position</label><select id="editPosition"></select></div>
        <div><label>NCOA</label><select id="editNcoa"></select></div>
      </div>
    </div>
    <div class="tracker-category-tabs">
      <button class="tracker-cat-btn" data-cat="ribbons">Ribbons</button>
      <button class="tracker-cat-btn" data-cat="badges">Badges</button>
    </div>
    <div class="tracker-count" id="trackerCount"></div>
    <div class="tracker-filters">
      <button class="tracker-filter-btn" data-mode="earned">Show Earned</button>
      ${cat.hasUnit ? '<button class="tracker-filter-btn" data-mode="company">Show Company</button>' : ''}
      <button class="tracker-filter-btn" data-mode="all">Show All</button>
    </div>
    <div class="badge-grid" id="trackerBadgeGrid"></div>
  `;

  const editRank = document.getElementById('editRank');
  const editUnit = document.getElementById('editUnit');
  const editPosition = document.getElementById('editPosition');
  const editNcoa = document.getElementById('editNcoa');
  editRank.innerHTML = RANKS.map(r=>`<option>${r.name}</option>`).join('');
  editUnit.innerHTML = UNIT_OPTIONS.map(u=>`<option>${u}</option>`).join('');
  editPosition.innerHTML = POSITION_OPTIONS.map(p=>`<option>${p}</option>`).join('');
  editNcoa.innerHTML = '<option value="">None</option>' + NCOA.map(n=>`<option value="${n.key}">${n.label}</option>`).join('');
  editRank.value = m.rank;
  editUnit.value = m.unit;
  editPosition.value = m.position;
  editNcoa.value = m.ncoaType || '';

  async function saveMemberField(){
    const edits = {
      id: m.id,
      name: document.getElementById('editName').value,
      rank: editRank.value,
      unit: editUnit.value,
      position: editPosition.value,
      ncoaType: editNcoa.value || null
    };
    MEMBERS = MEMBERS.map(x => x.id===m.id ? edits : x);
    await saveJSONChecked('members', MEMBERS);
    renderMemberList();
  }
  document.getElementById('editName').addEventListener('change', saveMemberField);
  editRank.addEventListener('change', ()=>{ saveMemberField(); });
  editUnit.addEventListener('change', ()=>{ saveMemberField(); renderTracker(); });
  editPosition.addEventListener('change', saveMemberField);
  editNcoa.addEventListener('change', saveMemberField);

  document.getElementById('deleteMemberBtn').addEventListener('click', async ()=>{
    if(!confirm(`Delete ${m.name}? This removes them and their earned records entirely — this cannot be undone.`)) return;
    MEMBERS = MEMBERS.filter(x => x.id !== m.id);
    delete TRACKER[m.id];
    delete RIBBON_TRACKER[m.id];
    selectedMemberId = null;
    await saveJSONChecked('members', MEMBERS);
    await saveJSONChecked('tracker', TRACKER);
    await saveJSONChecked('ribbontracker', RIBBON_TRACKER);
    renderMemberList();
    renderTracker();
  });

  body.querySelectorAll('.tracker-cat-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.cat === trackerCategory);
    btn.addEventListener('click', ()=>{
      trackerCategory = btn.dataset.cat;
      if(trackerFilterMode === 'company' && !currentCategoryData().hasUnit) trackerFilterMode = 'all';
      renderTracker();
    });
  });
  body.querySelectorAll('.tracker-filter-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.mode === trackerFilterMode);
    btn.addEventListener('click', ()=>{
      trackerFilterMode = btn.dataset.mode;
      renderTracker();
    });
  });
// Groups badges by unit so a member's own hierarchy isn't interleaved with
// other units' hierarchies -- own unit first, Battalion always second,
// remaining units alphabetical. Hierarchy (drag-order on the Badges page)
// still decides order within each group.
function groupRankForUnit(unit, memberUnit){
  if(unit === memberUnit) return 0;
  if(unit === 'Battalion') return 1;
  return 2;
}
function sortBadgesForDisplay(items, memberUnit){
  return [...items].sort((a,b)=>{
    const ua = a.unit || 'Battalion', ub = b.unit || 'Battalion';
    const ga = groupRankForUnit(ua, memberUnit), gb = groupRankForUnit(ub, memberUnit);
    if(ga !== gb) return ga - gb;
    if(ga === 2 && ua !== ub) return ua.localeCompare(ub);
    return BADGES.indexOf(a) - BADGES.indexOf(b);
  });
}

function sortRibbonsForDisplay(items){
  return [...items].sort((a,b)=>{
    const ia = a.inactive ? 1 : 0, ib = b.inactive ? 1 : 0;
    if(ia !== ib) return ia - ib;
    return RIBBONS.indexOf(a) - RIBBONS.indexOf(b);
  });
}

  const visibleItems = cat.items.filter(b=>{
    if(trackerFilterMode === 'earned') return earned.has(b.key);
    if(trackerFilterMode === 'company' && cat.hasUnit) return (b.unit || 'Battalion') === m.unit;
    return true;
  });
  const orderedItems = cat.hasUnit ? sortBadgesForDisplay(visibleItems, m.unit) : sortRibbonsForDisplay(visibleItems);
  const grid = document.getElementById('trackerBadgeGrid');
  if(orderedItems.length === 0){
    grid.innerHTML = `<div class="no-results">No ${cat.noun} match this filter.</div>`;
  } else {
    grid.innerHTML = '';
    let lastUnit = null;
    let rankInGroup = 0;
    orderedItems.forEach(b=>{
      const itemUnit = b.unit || 'Battalion';
      if(cat.hasUnit && itemUnit !== lastUnit){
        const header = document.createElement('div');
        header.className = 'badge-group-header';
        header.textContent = itemUnit;
        grid.appendChild(header);
        lastUnit = itemUnit;
        rankInGroup = 0;
      }
      rankInGroup++;
      const wrap = document.createElement('label');
      wrap.className = 'badge-check';
      const rankTag = cat.hasUnit ? `<span class="rank-tag">#${rankInGroup}</span>` : '';
      const inactiveTag = b.inactive ? '<span class="inactive-tag">Inactive</span>' : '';
      wrap.innerHTML = `${rankTag}<input type="checkbox" data-key="${b.key}"${earned.has(b.key) ? ' checked' : ''}><span class="swatch" style="${b.image ? `background-image:url(${b.image})` : ''}"></span><span class="check-label">${b.label}</span>${inactiveTag}`;
      grid.appendChild(wrap);
    });
  }
  grid.addEventListener('change', async (e)=>{
    const key = e.target.dataset.key;
    const current = new Set(cat.tracker[m.id] || []);
    if(e.target.checked) current.add(key); else current.delete(key);
    cat.tracker[m.id] = Array.from(current);
    updateCount(m.id);
    await saveJSONChecked(cat.storageKey, cat.tracker);
    if(trackerFilterMode === 'earned') renderTracker();
  });
  updateCount(m.id);
}

function updateCount(memberId){
  const cat = currentCategoryData();
  const count = (cat.tracker[memberId] || []).length;
  document.getElementById('trackerCount').textContent = `${count} of ${cat.items.length} ${cat.noun} recorded as earned`;
}

document.getElementById('searchInput').addEventListener('input', (e)=>{
  searchTerm = e.target.value;
  renderMemberList();
});

document.getElementById('unitFilterSelect').innerHTML = UNITS.map(u=>`<option>${u}</option>`).join('');
document.getElementById('unitFilterSelect').addEventListener('change', (e)=>{
  unitFilter = e.target.value;
  renderMemberList();
});

async function init(){
  MEMBERS = await loadJSON('members', []);
  BADGES = await loadJSON('badges', []);
  RIBBONS = await loadJSON('ribbons', []);
  const rawRanks = await loadJSON('ranks', []);
  RANKS = normalizeRanks(rawRanks);
  NCOA = await loadJSON('ncoa', DEFAULT_NCOA);
  TRACKER = await loadJSON('tracker', {});
  RIBBON_TRACKER = await loadJSON('ribbontracker', {});
  // One-time reconciliation: a badge or ribbon already selected for display
  // on a member's jacket counts as earned, even for members whose data
  // predates the save-time sync that now keeps these in step going forward.
  let trackerNeedsBackfill = false;
  let ribbonTrackerNeedsBackfill = false;
  let membersNeedCleanup = false;
  MEMBERS.forEach(m=>{
    const earnedSet = new Set(TRACKER[m.id] || []);
    const before = earnedSet.size;
    (m.badges||[]).forEach(key=>earnedSet.add(key));
    if(earnedSet.size !== before){
      TRACKER[m.id] = Array.from(earnedSet);
      trackerNeedsBackfill = true;
    }
    const earnedRibbonSet = new Set(RIBBON_TRACKER[m.id] || []);
    const ribbonBefore = earnedRibbonSet.size;
    (m.ribbons||[]).forEach(key=>earnedRibbonSet.add(key));
    if(earnedRibbonSet.size !== ribbonBefore){
      RIBBON_TRACKER[m.id] = Array.from(earnedRibbonSet);
      ribbonTrackerNeedsBackfill = true;
    }
    // This backfill only needs to run once per member -- if the old fields
    // are left in place, every future page load re-folds them back in,
    // silently undoing anything unchecked on Tracker/Admin since. Clearing
    // them here is what actually makes this "one last time" rather than
    // "every time."
    if('badges' in m || 'ribbons' in m){
      delete m.badges;
      delete m.ribbons;
      membersNeedCleanup = true;
    }
  });
  if(trackerNeedsBackfill) await saveJSON('tracker', TRACKER);
  if(ribbonTrackerNeedsBackfill) await saveJSON('ribbontracker', RIBBON_TRACKER);
  if(membersNeedCleanup) await saveJSON('members', MEMBERS);

  // Reached via a jacket card's click-through from the roster page — jump
  // straight to that member, and switch the unit filter to theirs so they're
  // actually visible in the list rather than selected-but-hidden.
  const requestedId = new URLSearchParams(window.location.search).get('member');
  const requestedMember = requestedId ? MEMBERS.find(m=>m.id===requestedId) : null;
  if(requestedMember){
    selectedMemberId = requestedMember.id;
    unitFilter = requestedMember.unit;
    document.getElementById('unitFilterSelect').value = unitFilter;
  }

  renderMemberList();
  renderTracker();
}
init();

document.getElementById('newMemberBtn').addEventListener('click', async ()=>{
  const member = { id:newId(), name:"New Member", rank: (RANKS[0] && RANKS[0].name) || "PVT", unit: UNIT_OPTIONS[0], position:"Member", ncoaType:null };
  MEMBERS.push(member);
  await saveJSONChecked('members', MEMBERS);
  selectedMemberId = member.id;
  renderMemberList();
  renderTracker();
});
</script>
