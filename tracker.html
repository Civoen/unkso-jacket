<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UNKSO — Badge Tracker</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap');
:root{
  --bg-page:#14161c; --bg-panel:#1b1e26; --bg-card:#20232c;
  --border:#2c303a; --orange:#e35f2e; --orange-dim:#b8481f;
  --text-primary:#f2f1ee; --text-secondary:#9aa0ab; --text-muted:#6b7280;
  --red:#c0392b;
}
*{box-sizing:border-box;}
body{margin:0; background:var(--bg-page); color:var(--text-primary); font-family:'Inter',sans-serif;}

.subnav{display:flex; align-items:center; gap:30px; padding:16px 32px; background:var(--bg-panel); border-bottom:1px solid var(--border);}
.subnav a{color:var(--text-secondary); text-decoration:none; font-size:14px; font-weight:500; padding-bottom:4px; border-bottom:2px solid transparent;}
.subnav a.active{color:var(--orange); border-color:var(--orange);}
.subnav a.nav-secondary{
  margin-left:auto;
  color:var(--text-secondary); background:var(--bg-card); border:1px solid var(--border);
  padding:6px 16px; border-radius:7px; font-weight:600; text-decoration:none; font-size:13px; cursor:pointer;
}
.subnav a.nav-secondary:hover{border-color:var(--orange-dim); color:var(--orange);}
.subnav a.nav-cta{
  color:#1c1108; background:var(--orange); padding:7px 18px; border-radius:7px;
  font-weight:700; border-bottom:none; box-shadow:0 1px 0 rgba(0,0,0,.2);
}
.subnav a.nav-cta:hover{background:#f06c37;}

.nav-dropdown{position:relative;}
.nav-dropdown > a{display:block;}
.nav-dropdown-menu{
  display:none; position:absolute; top:100%; left:0; padding-top:10px; z-index:20;
}
.nav-dropdown:hover .nav-dropdown-menu{display:block;}
.nav-dropdown-menu-inner{
  background:var(--bg-card); border:1px solid var(--border); border-radius:8px;
  min-width:130px; padding:6px; box-shadow:0 8px 24px rgba(0,0,0,.4);
}
.nav-dropdown-menu a{
  display:block; padding:8px 10px; border-radius:6px; font-size:13px;
  color:var(--text-secondary); text-decoration:none; border-bottom:none;
}
.nav-dropdown-menu a:hover, .nav-dropdown-menu a.active{background:var(--bg-panel); color:var(--orange);}

main{max-width:1200px; margin:0 auto; padding:32px; display:grid; grid-template-columns:320px 1fr; gap:24px; align-items:start;}
h1{font-family:'Poppins'; font-weight:600; font-size:22px; margin:0 0 4px;}
.sub{color:var(--text-muted); font-size:12.5px; margin-bottom:22px; letter-spacing:.03em;}

.panel{background:var(--bg-panel); border:1px solid var(--border); border-radius:14px; padding:20px;}

.search-row{margin-bottom:12px;}
.search-row input{
  width:100%; background:var(--bg-card); border:1px solid var(--border); color:var(--text-primary);
  padding:10px 14px; border-radius:8px; font-size:14px; font-family:'Inter';
}
.filter-row{margin-bottom:14px;}
.filter-row select{
  width:100%; background:var(--bg-card); border:1px solid var(--border); color:var(--text-primary);
  padding:9px 12px; border-radius:8px; font-size:13.5px; font-family:'Inter';
}

.member-list{max-height:640px; overflow-y:auto;}
.member-item{
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding:10px 12px; border-radius:8px; cursor:pointer; font-size:13.5px; margin-bottom:4px;
}
.member-item:hover{background:var(--bg-card);}
.member-item.selected{background:var(--bg-card); border:1px solid var(--orange-dim); color:var(--orange);}
.member-item .unit-tag{font-size:10.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em;}
.member-item.selected .unit-tag{color:var(--orange-dim);}
.no-results{color:var(--text-muted); font-size:12.5px; padding:8px 4px;}

.tracker-header{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:4px;}
.tracker-header h2{font-family:'Poppins'; font-weight:600; font-size:18px; margin:0;}
.tracker-header .tag{color:var(--text-muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em;}
.tracker-count{color:var(--text-muted); font-size:12.5px; margin-bottom:16px;}

.badge-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.badge-check{display:flex; align-items:center; gap:8px; background:var(--bg-card); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:12.5px; cursor:pointer;}
.badge-check input{margin:0;}
.badge-check .swatch{width:16px; height:16px; border-radius:3px; border:1px solid rgba(0,0,0,.35); flex-shrink:0; background-size:contain; background-position:center; background-repeat:no-repeat;}
.badge-check .unit-tag{color:var(--text-muted); font-size:10.5px; margin-left:auto; text-transform:uppercase; letter-spacing:.03em;}

.empty-state{color:var(--text-muted); font-size:13px; padding:40px 0; text-align:center;}

.site-footer{border-top:1px solid var(--border); padding:18px 20px; text-align:center; color:var(--text-muted); font-size:11.5px; letter-spacing:.02em;}

/* Toast notifications */
.toast-container{position:fixed; bottom:20px; right:20px; z-index:500; display:flex; flex-direction:column; gap:10px; pointer-events:none; max-width:340px;}
.toast{background:var(--bg-panel); border:1px solid var(--border); border-left:4px solid var(--orange); color:var(--text-primary); padding:12px 16px; border-radius:8px; font-size:13px; line-height:1.4; box-shadow:0 4px 14px rgba(0,0,0,.4); pointer-events:auto; opacity:0; transform:translateY(8px); transition:opacity .2s, transform .2s;}
.toast.show{opacity:1; transform:translateY(0);}
.toast.error{border-left-color:var(--red, #c0392b);}
.toast.success{border-left-color:#4caf6b;}

/* Password gate */
.auth-gate{position:fixed; inset:0; background:rgba(10,11,14,.94); z-index:1000; display:flex; align-items:center; justify-content:center; padding:20px;}
.auth-box{background:var(--bg-panel); border:1px solid var(--border); border-radius:14px; padding:32px; max-width:340px; width:100%; text-align:center;}
.auth-box h2{font-family:'Poppins'; font-weight:600; font-size:19px; margin:0 0 8px; color:var(--orange);}
.auth-box p{color:var(--text-secondary); font-size:13px; margin:0 0 18px;}
.auth-box input{width:100%; background:var(--bg-card); border:1px solid var(--border); color:var(--text-primary); padding:11px 14px; border-radius:8px; font-size:14px; text-align:center; margin-bottom:12px; font-family:'Inter'; box-sizing:border-box;}
.auth-box button{width:100%; background:var(--orange); color:#1c1108; border:none; border-radius:8px; padding:11px; font-family:'Poppins'; font-weight:600; font-size:14px; cursor:pointer;}
.auth-box button:hover{background:#f06c37;}
.auth-error{color:var(--red, #c0392b); font-size:12.5px; margin-top:10px; display:none;}
/* Mobile */
@media (max-width:800px){
  main{grid-template-columns:1fr; padding:20px; gap:16px;}
}
@media (max-width:520px){
  .subnav{padding:12px 16px; gap:18px; overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .subnav a{flex-shrink:0;}
  main{padding:14px;}
  .panel{padding:14px;}
  .badge-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="auth-gate" id="authGate">
  <div class="auth-box">
    <h2>Restricted Access</h2>
    <p>Enter the password to continue.</p>
    <input type="password" id="authPassword" placeholder="Password" autocomplete="off">
    <button id="authSubmit">Enter</button>
    <div class="auth-error" id="authError">Incorrect password.</div>
  </div>
</div>
<div class="toast-container" id="toastContainer"></div>

<div class="subnav">
  <a href="index.html">Jackets</a>
  <a href="ranks.html">Ranks</a>
  <a href="ribbons.html">Ribbons</a>
  <div class="nav-dropdown">
    <a href="badges.html">Badges</a>
    <div class="nav-dropdown-menu">
      <div class="nav-dropdown-menu-inner">
        <a href="tracker.html" class="active">Tracker</a>
      </div>
    </div>
  </div>
  <a href="pins.html">Pins</a>
  <a href="index.html?autodownload=1" class="nav-secondary">Download All</a>
  <a href="admin.html" class="nav-cta">Admin</a>
</div>

<main>
  <div class="panel">
    <div class="search-row"><input id="searchInput" type="text" placeholder="Search members…"></div>
    <div class="filter-row">
      <select id="unitFilterSelect"></select>
    </div>
    <div class="member-list" id="memberList"></div>
  </div>

  <div class="panel">
    <div id="trackerBody"><div class="empty-state">Select a member to view their badge record.</div></div>
  </div>
</main>

<script>
// --- Password gate + toast notifications (shared across every page) ---
const SITE_PASSWORD = 'boost';
let AUTH_OK = false;

function withAuth(url){
  if(!AUTH_OK) return url;
  try{
    const u = new URL(url, window.location.href);
    u.searchParams.set('k', SITE_PASSWORD);
    return u.pathname + u.search;
  }catch(e){ return url; }
}

function carryAuthForward(){
  document.querySelectorAll('a[href]').forEach(a=>{
    const href = a.getAttribute('href');
    if(!href || !href.includes('.html')) return;
    a.setAttribute('href', withAuth(href));
  });
}

(function initAuthGate(){
  const params = new URLSearchParams(window.location.search);
  const gate = document.getElementById('authGate');
  if(params.get('k') === SITE_PASSWORD){
    AUTH_OK = true;
    if(gate) gate.remove();
    carryAuthForward();
    return;
  }
  const submit = document.getElementById('authSubmit');
  const input = document.getElementById('authPassword');
  const error = document.getElementById('authError');
  function tryUnlock(){
    if(input.value === SITE_PASSWORD){
      AUTH_OK = true;
      gate.remove();
      carryAuthForward();
    } else {
      error.style.display = 'block';
      input.value = '';
      input.focus();
    }
  }
  submit.addEventListener('click', tryUnlock);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
  input.focus();
})();

function showToast(message, type){
  const container = document.getElementById('toastContainer');
  if(!container) return;
  const toast = document.createElement('div');
  toast.className = 'toast' + (type === 'error' ? ' error' : type === 'success' ? ' success' : '');
  toast.textContent = message;
  container.appendChild(toast);
  requestAnimationFrame(()=> toast.classList.add('show'));
  setTimeout(()=>{
    toast.classList.remove('show');
    setTimeout(()=> toast.remove(), 250);
  }, 4000);
}

const UNITS = ["Battalion","Bravo","Charlie","Delta"];
const API_BASE = 'https://unkso-api.adambramfitt.workers.dev';

async function loadJSON(key, defaults){
  try{
    const res = await fetch(`${API_BASE}/api/${key}`);
    if(res.ok){
      const data = await res.json();
      if(data !== null) return data;
    }
  }catch(err){ console.log('Could not load '+key+' from API, using defaults', err); }
  return defaults;
}

async function saveJSON(key, value){
  try{
    const res = await fetch(`${API_BASE}/api/${key}`, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(value)
    });
    return res.ok;
  }catch(err){ console.log('Save failed for '+key, err); return false; }
}

function normalizeRanks(ranks){
  return ranks.map(r => typeof r === 'string' ? { name:r, insignia:null } : r);
}

let MEMBERS = [];
let BADGES = [];
let RANKS = [];
let TRACKER = {};
let searchTerm = '';
let unitFilter = UNITS[0];
let selectedMemberId = null;

function rankIndex(name){ return RANKS.findIndex(r=>r.name===name); }

function sortedMembers(){
  return [...MEMBERS].sort((a,b)=>{
    const ai = rankIndex(a.rank); const bi = rankIndex(b.rank);
    const aRank = ai === -1 ? RANKS.length : ai;
    const bRank = bi === -1 ? RANKS.length : bi;
    if(aRank !== bRank) return aRank - bRank;
    return a.name.localeCompare(b.name);
  });
}

function renderMemberList(){
  const list = document.getElementById('memberList');
  const q = searchTerm.trim().toLowerCase();
  const visible = sortedMembers().filter(m=>{
    if(m.unit !== unitFilter) return false;
    return !q || m.name.toLowerCase().includes(q);
  });

  if(visible.length === 0){
    list.innerHTML = `<div class="no-results">No ${unitFilter} members${q ? ' match your search' : ''}.</div>`;
    return;
  }

  list.innerHTML = '';
  visible.forEach(m=>{
    const row = document.createElement('div');
    row.className = 'member-item' + (m.id === selectedMemberId ? ' selected' : '');
    row.innerHTML = `<span>${m.name}</span><span class="unit-tag">${m.rank}</span>`;
    row.addEventListener('click', ()=>{
      selectedMemberId = m.id;
      renderMemberList();
      renderTracker();
    });
    list.appendChild(row);
  });
}

function renderTracker(){
  const body = document.getElementById('trackerBody');
  const m = MEMBERS.find(x=>x.id===selectedMemberId);
  if(!m){
    body.innerHTML = '<div class="empty-state">Select a member to view their badge record.</div>';
    return;
  }
  const earned = new Set(TRACKER[m.id] || []);
  body.innerHTML = `
    <div class="tracker-header"><h2>${m.name}</h2><span class="tag">${m.rank} — ${m.unit}</span></div>
    <div class="tracker-count" id="trackerCount"></div>
    <div class="badge-grid" id="trackerBadgeGrid"></div>
  `;
  const grid = document.getElementById('trackerBadgeGrid');
  BADGES.forEach(b=>{
    const wrap = document.createElement('label');
    wrap.className = 'badge-check';
    wrap.innerHTML = `<input type="checkbox" data-key="${b.key}"${earned.has(b.key) ? ' checked' : ''}><span class="swatch" style="${b.image ? `background-image:url(${b.image})` : ''}"></span>${b.label}<span class="unit-tag">${b.unit || 'Battalion'}</span>`;
    grid.appendChild(wrap);
  });
  grid.addEventListener('change', async (e)=>{
    const key = e.target.dataset.key;
    const current = new Set(TRACKER[m.id] || []);
    if(e.target.checked) current.add(key); else current.delete(key);
    TRACKER[m.id] = Array.from(current);
    updateCount(m.id);
    await saveJSON('tracker', TRACKER);
  });
  updateCount(m.id);
}

function updateCount(memberId){
  const count = (TRACKER[memberId] || []).length;
  document.getElementById('trackerCount').textContent = `${count} of ${BADGES.length} badges recorded as earned`;
}

document.getElementById('searchInput').addEventListener('input', (e)=>{
  searchTerm = e.target.value;
  renderMemberList();
});

document.getElementById('unitFilterSelect').innerHTML = UNITS.map(u=>`<option>${u}</option>`).join('');
document.getElementById('unitFilterSelect').addEventListener('change', (e)=>{
  unitFilter = e.target.value;
  renderMemberList();
});

async function init(){
  MEMBERS = await loadJSON('members', []);
  BADGES = await loadJSON('badges', []);
  const rawRanks = await loadJSON('ranks', []);
  RANKS = normalizeRanks(rawRanks);
  TRACKER = await loadJSON('tracker', {});
  renderMemberList();
}
init();
</script>

<div class="site-footer">Unknown Soldiers. Site created and maintained by Civoen. v.034</div>

</body>
</html>
